name: Deploy backend to Hugging Face

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Hugging Face client
        run: pip install 'huggingface_hub>=0.34,<1'
      - name: Upload Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          test -n "$HF_TOKEN" || (echo 'Falta el secreto HF_TOKEN' && exit 1)
          test -n "$HF_SPACE_ID" || (echo 'Falta la variable HF_SPACE_ID, por ejemplo SVN11X/screencribe-api' && exit 1)
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_SPACE_ID"]
          api = HfApi(token=token)
          api.create_repo(repo_id=repo_id, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="backend",
              ignore_patterns=["tests/**", "__pycache__/**", "*.pyc"],
              commit_message="Deploy Screencribe backend",
          )
          PY
