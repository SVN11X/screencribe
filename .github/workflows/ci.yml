name: Validate repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check JavaScript and native format selection
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test tests/*.test.mjs
      - name: Install browser test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify native capture, direct downloads and absence of dependency requests
        env:
          SCREENCRIBE_PYTHON: python
        run: node tests/browser.test.cjs
      - name: Check static files and absence of conversion libraries
        run: |
          test -f index.html && test -f src/capture-worker.js && test -f src/recording-formats.js
          test ! -d assets/vendor && test ! -f src/local-converter.js
